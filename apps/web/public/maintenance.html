<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vonos Group</title>
    <meta
      name="description"
      content="We are working on a new and improved experience for our customers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        color: #f8fafc;
        background: radial-gradient(
          120% 80% at 50% -10%,
          #3b82f6 0%,
          #1e40af 42%,
          #0f172a 100%
        );
      }
      main {
        position: relative;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 0 1.5rem;
        text-align: center;
      }
      .glow {
        pointer-events: none;
        position: absolute;
        inset: 0;
        opacity: 0.4;
        background-image:
          radial-gradient(
            circle at 20% 80%,
            rgba(147, 197, 253, 0.25),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 25%,
            rgba(96, 165, 250, 0.2),
            transparent 35%
          );
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        max-width: 48rem;
        flex-direction: column;
        align-items: center;
        gap: 2.5rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.75rem, 8vw, 5.5rem);
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 24px rgba(15, 23, 42, 0.35);
      }
      .copy {
        max-width: 32rem;
      }
      .eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(186, 230, 253, 0.9);
      }
      .message {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 400;
        line-height: 1.6;
        color: rgba(224, 242, 254, 0.95);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="glow" aria-hidden="true"></div>
      <div class="content">
        <h1>Vonos Group</h1>
        <div class="copy">
          <p class="eyebrow">Under maintenance</p>
          <p class="message">
            We are working on a new and improved experience for our customers.
            Thank you for your patience.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
